name: Temporary Build Check
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Batch dialog closing tag
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('features/batches/components/batches-manager.tsx')
          text = path.read_text()
          old = '</Button></DialogFooter></Dialog>\n  </>;'
          new = '</Button></DialogFooter></DialogContent></Dialog>\n  </>;'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name "Learning Is Fun Build Fix"
            git config user.email "actions@users.noreply.github.com"
            git add features/batches/components/batches-manager.tsx
            git commit -m "Fix Batch delete dialog markup"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
